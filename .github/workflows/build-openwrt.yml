# Build OpenWrt for the Fingbox from the fork branch, rebased on the latest
# OpenWrt main, and publish the images as a GitHub release.
#
# The Wi-Fi calibration file is NOT part of these images (it is Domotz's file);
# it lives on the device and survives sysupgrade via /etc/sysupgrade.conf.
name: Build OpenWrt (Fingbox)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  push:
    branches: [main]
    paths:
      - openwrt/fingbox.config
      - .github/workflows/build-openwrt.yml

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  FORK_URL: https://github.com/taufderl/openwrt.git
  FORK_BRANCH: fingbox
  UPSTREAM_URL: https://github.com/openwrt/openwrt.git
  SRC: ${{ github.workspace }}/openwrt-src
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl xz-utils zstd bzip2 patch perl time libelf-dev ccache

      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out OpenWrt and rebase the Fingbox branch on main
        run: |
          git clone --branch "$FORK_BRANCH" "$FORK_URL" "$SRC"
          cd "$SRC"
          git config user.name "fingbox-ci"
          git config user.email "fingbox-ci@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --quiet upstream main
          git rebase --quiet upstream/main
          git log --oneline upstream/main..HEAD
          {
            echo "OPENWRT_UPSTREAM=$(git rev-parse --short upstream/main)"
            echo "OPENWRT_HEAD=$(git rev-parse --short HEAD)"
            echo "FINGBOX_COMMITS=$(git rev-list --count upstream/main..HEAD)"
            echo "BUILD_DATE=$(date -u +%Y.%m.%d)"
          } >> "$GITHUB_ENV"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt-src/dl
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Configure
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp "$GITHUB_WORKSPACE/openwrt/fingbox.config" .config
          echo 'CONFIG_PACKAGE_luci-app-tailscale-community=y' >> .config
          sed -i "s/^CONFIG_VERSION_NUMBER=.*/CONFIG_VERSION_NUMBER=\"Fingbox $BUILD_DATE\"/" .config
          make defconfig
          grep -E 'DEVICE_fing_fingbox|VERSION_NUMBER|PACKAGE_tailscale=' .config

      - name: Download sources
        working-directory: openwrt-src
        run: make -j8 download

      - name: Build
        working-directory: openwrt-src
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt-src/bin/targets/sunxi/cortexa7/*fing_fingbox* out/
          cd out
          sha256sum * > SHA256SUMS
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingbox-openwrt-${{ env.BUILD_DATE }}-${{ env.OPENWRT_HEAD }}
          path: out/

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fingbox-${{ env.BUILD_DATE }}-${{ env.OPENWRT_HEAD }}
          name: OpenWrt Fingbox ${{ env.BUILD_DATE }}
          body: |
            OpenWrt main @ ${{ env.OPENWRT_UPSTREAM }} with ${{ env.FINGBOX_COMMITS }} Fingbox commits
            from [taufderl/openwrt@fingbox](https://github.com/taufderl/openwrt/tree/fingbox).

            - `*-squashfs-sdcard.img.gz`: sysupgrade image (keeps the vendor U-Boot)
            - `*-initramfs-kernel.bin`: installer, boot with `bootz` from the vendor U-Boot

            The Wi-Fi calibration file is not included; see the README.
          files: out/*
